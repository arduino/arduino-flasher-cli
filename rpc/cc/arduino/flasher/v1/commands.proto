syntax = "proto3";

package cc.arduino.flasher.v1;

import "cc/arduino/flasher/v1/common.proto";

option go_package = "github.com/arduino/arduino-flasher-cli/rpc/cc/arduino/flasher/v1;flasher";

// Provides RPCs to flash Arduino images onto selected boards.
service Flasher {
  // Retrieves the images available for flashing
  rpc List(ListRequest) returns (ListResponse) {}

  // Starts the flashing process
  rpc Flash(FlashRequest) returns (stream FlashResponse);

  // Returns the available space for a given filesystem path
  // located on the arduino-flasher-cli storage device.
  rpc GetAvailableFreeSpace(GetAvailableFreeSpaceRequest) returns (GetAvailableFreeSpaceResponse) {}
}

message ListRequest {
  // Only list images for this board ("unoq"). Empty lists every board there
  // are images for, which is how to discover them.
  string board = 1;
  // Only list images of this distribution ("debian"). Empty lists all of them.
  string os = 2;
}

message ListResponse {
  // The images matching the request, most recent first.
  repeated Release releases = 1;
}

// Identifies one published image. All three parts are needed: the same version
// can name a different image on another board or another distribution.
message Release {
  // The version of the image, a build date and number: "20250807-136".
  string build_id = 1;
  // Whether this is the most recent image of its board and distribution. Of
  // both, since a response may span several of either.
  bool latest = 2;
  // The board the image is built for: "unoq", "ventunoq".
  string board = 3;
  // The distribution the image is built for ("debian"). Empty when the index
  // named none.
  string os = 4;
}

message FlashRequest {
  // The version of the image to flash. Required: the most recent image is not
  // assumed, call List to pick one.
  string version = 1;
  // The path in which the image will be downloaded and extracted.
  // If an image file is already present, it will not be downloaded again.
  string temp_path = 2;
  // Preserve user partition if possible.
  bool preserve_user = 3;
  // Serial number of the target board to flash, as a decimal integer string.
  // Leave empty to target the first discovered board.
  string serial = 4;
  // The board to flash, e.g. "unoq". Required: which board is connected cannot
  // be read before flashing it.
  string board = 5;
  // The distribution to flash, e.g. "debian". Required alongside the version
  // and the board: a version alone can be a different image on another board.
  string os = 6;
}

message FlashResponse {
  message Result {
    // Empty message, reserved for future expansion.
  }
  oneof message {
    // Progress of the download.
    DownloadProgress download_progress = 1;
    // Progress of the extraction.
    TaskProgress extraction_progress = 2;
    // Progress of qdl flashing.
    TaskProgress flash_progress = 3;
    // Flashing result.
    Result result = 4;
  }
}

message GetAvailableFreeSpaceRequest {
  // Filesystem path to be checked.
  string path = 1;
}

message GetAvailableFreeSpaceResponse {
  // Free space in bytes
  uint64 free_space = 1;
}
