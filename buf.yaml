version: v2
breaking:
  use:
    - FILE
lint:
  use:
    - STANDARD
    - COMMENT_ENUM
    - COMMENT_ENUM_VALUE
    - COMMENT_FIELD
    - COMMENT_RPC
    - COMMENT_SERVICE
  # The service is named after its package, so a "Service" suffix only stutters.
  except:
    - SERVICE_SUFFIX
modules:
  - path: rpc
    name: buf.build/arduino/arduino-flasher-cli
